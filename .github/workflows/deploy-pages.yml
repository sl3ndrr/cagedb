# .github/workflows/deploy-pages.yml
name: Deploy CageDB to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js for validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: node --test tests/*.test.mjs tools/initial-import/import-core.test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find public/js tools/initial-import -type f \
            \( -name '*.js' -o -name '*.mjs' \) \
            -exec node --check {} \;

      - name: Reject placeholders and server credentials
        shell: bash
        run: |
          set -euo pipefail

          if grep -qE 'YOUR_PROJECT_REF|YOUR_PUBLIC_ANON_OR_PUBLISHABLE_KEY' public/js/config.js; then
            echo 'Configure public/js/config.js before deploying.' >&2
            exit 1
          fi

          if grep -RqiE 'SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|service[_-]?role[_-]?key|sb_secret_' public; then
            echo 'A server-only credential marker was found inside public/.' >&2
            exit 1
          fi

          if find public -type f \( -name '*.csv' -o -name '*.xlsx' -o -name '*.xls' -o -name '.env' \) -print -quit | grep -q .; then
            echo 'A source-data or environment file was found inside public/.' >&2
            exit 1
          fi

          test -f public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy static site
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
